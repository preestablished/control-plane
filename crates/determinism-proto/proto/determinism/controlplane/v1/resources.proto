syntax = "proto3";
package determinism.controlplane.v1;

message ExperimentSpec {
  uint32 version = 1;
  uint64 seed = 2;

  string workload_image_ref = 3;
  string feature_map_ref = 4;
  string scoring_program_ref = 5;
  string synth_config_ref = 6;
  repeated string macro_pack_refs = 7;

  Budgets budgets = 8;
  SelectionConfig selection = 9;
  BurstConfig burst = 10;
  PlateauConfig plateau = 11;
  SchedulingConfig scheduling = 12;
  CheckpointConfig checkpoint = 13;
  PruneAction prune_action = 14;
  OnGoal on_goal = 15;
  repeated string decoded_features = 16;
}

enum PruneAction {
  PRUNE_ACTION_EXHAUSTED = 0;
  PRUNE_ACTION_DROP = 1;
}

enum OnGoal {
  ON_GOAL_STOP = 0;
  ON_GOAL_CONTINUE = 1;
}

enum PolicyKind {
  POLICY_KIND_SOFTMAX = 0;
  POLICY_KIND_UCB = 1;
  POLICY_KIND_STAGED = 2;
}

enum SchedMode {
  SCHED_MODE_FAST = 0;
  SCHED_MODE_DETERMINISTIC = 1;
}

message Budgets {
  uint64 max_nodes = 1;
  uint64 max_wall_clock_s = 2;
  uint64 max_guest_instructions = 3;
  uint64 max_expansions = 4;
}

message SelectionConfig {
  PolicyKind policy = 1;
  double alpha = 2;
  double beta = 3;
  double gamma = 4;
  double delta = 5;
  double temperature = 6;
  double ucb_c = 7;
  StagedConfig staged = 8;
  uint32 max_visits_per_node = 9;
  uint32 exhaust_after_dup_expansions = 10;
}

message StagedConfig {
  PolicyKind inner = 1;
  double epsilon_regress = 2;
}

message BurstConfig {
  uint32 k_per_expansion = 1;
  uint32 base_burst_len_frames = 2;
  uint32 max_burst_len_frames = 3;
  uint64 max_guest_instructions_per_job = 4;
}

message PlateauConfig {
  uint32 window_n = 1;
  double epsilon_s = 2;
  LadderConfig ladder = 3;
}

message LadderConfig {
  double burst_len_factor = 1;
  double temp_factor = 2;
  double macro_weight_hot = 3;
  double backtrack_kappa = 4;
  double backtrack_depth_quantile = 5;
  double radius_factor = 6;
  uint32 max_level = 7;
}

message SchedulingConfig {
  SchedMode mode = 1;
  uint32 max_inflight_batches = 2;
  uint32 job_timeout_s = 3;
  uint32 retry_max = 4;
  uint32 retry_backoff_ms = 5;
  repeated string hypervisor_endpoints = 6;
  bool allow_class_mismatch = 7;
}

message CheckpointConfig {
  uint32 every_commits = 1;
  uint32 every_seconds = 2;
}
