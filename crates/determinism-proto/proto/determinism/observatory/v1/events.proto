// Canonical platform-wide event envelope and ingest surface.
//
// Source of truth: observatory API.md §1 (envelope + producer rules) and
// §2 (the event-type catalog and payload JSON schemas — payloads are
// documented there, not in proto). Reconciliation decisions D1/D2/D7:
// observatory/docs/event-contract-reconciliation-v1.md.
//
// Family status: vdev (pre-release) per docs/proto-freeze-policy.md.
syntax = "proto3";

package determinism.observatory.v1;

service EventIngest {
  // Long-lived bidirectional stream: client sends envelopes, server returns
  // durable acks. The normal path for all producers.
  rpc PublishEvents(stream EventEnvelope) returns (stream PublishAck);
  // Unary bulk path: backfill / reconnect catch-up. Atomic per batch.
  rpc PublishEventsBulk(EventBatch) returns (PublishAck);
}

message EventEnvelope {
  // MUST be 1. Bump only with a platform-wide migration.
  uint32 envelope_version = 1;
  // Producer-local logical time, monotone non-decreasing per
  // (run_id, source_service). Orchestrator: the expansion index. Periodic
  // emitters: a local tick counter. NEVER compared across producers.
  uint64 ts_logical = 2;
  // Producer wall clock, ns since epoch. Advisory only (display,
  // retention); ordering uses ts_logical + seq.
  uint64 ts_wall_ns = 3;
  // Run identity. In standalone mode (Phase 5) run_id = experiment_id.
  // Producers that are not run-scoped use "".
  string run_id = 4;
  SourceService source_service = 5;
  // lowercase-hyphen, from the catalog in API.md §2.
  string event_type = 6;
  // Schema version of the payload for this event_type.
  uint32 payload_version = 7;
  // UTF-8 JSON object per the catalog. May be empty {}. Size limit 64 KiB
  // (larger => rejected).
  bytes payload_json = 8;
  // Per-producer-SESSION monotone counter starting at 1.
  // Idempotency/resume key; see PublishAck.
  uint64 seq = 9;
  // Instance disambiguator, e.g. "replayd-01". Folded into the source
  // identity for seq tracking.
  string producer_id = 10;
}

enum SourceService {
  SOURCE_SERVICE_UNSPECIFIED = 0;
  // The only v1 (Phase 5) event producer.
  SOURCE_SERVICE_EXPLORATION_ORCHESTRATOR = 1;
  // Reserved; scrape-only in v1 (no gRPC to observatory).
  SOURCE_SERVICE_DETERMINISM_HYPERVISOR = 2;
  // Reserved; scrape + Stats pulls in v1, no event push.
  SOURCE_SERVICE_STATE_SCORER = 3;
  // Phase 7 producer (replay/divergence events).
  SOURCE_SERVICE_REPLAY_RENDERER = 4;
  // Reserved for run lifecycle relays; unused in v1.
  SOURCE_SERVICE_CONTROL_PLANE = 5;
  // Reserved; guest findings are relayed by the orchestrator in v1.
  SOURCE_SERVICE_GUEST_SDK = 6;
}

message EventBatch {
  repeated EventEnvelope events = 1;
}

message PublishAck {
  // Highest seq durably committed IN STREAM ORDER for this producer
  // identity (run_id, source_service, producer_id). Gaps are permitted —
  // producers legitimately drop-oldest under buffer pressure, so the ack
  // advances past missing seqs (decision D7). On reconnect, resend from
  // acked+1; always safe because the server dedups on (identity, seq).
  uint64 acked_seq = 1;
  // Set when the server rejected events (bad envelope_version,
  // unparseable payload JSON, missing run_id from a run-scoped source).
  // Rejected events are NOT acked; producer should log-and-drop after
  // max_reject_retries.
  repeated Rejection rejections = 2;
}

message Rejection {
  uint64 seq = 1;
  string reason = 2;
}
