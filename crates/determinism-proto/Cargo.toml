[package]
name = "determinism-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared Project Determinism protobuf contract facade"

[features]
default = ["all"]
all = [
  "common",
  "hypervisor",
  "snapstore",
  "orchestrator",
  "inputsynth",
  "policy",
  "scorer",
  "replay",
  "observatory",
  "controlplane",
]
common = []
hypervisor = ["common"]
snapstore = ["common"]
orchestrator = ["common", "controlplane"]
inputsynth = [
  "common",
  "dep:prost",
  "dep:protoc-bin-vendored",
  "dep:tonic",
  "dep:tonic-build",
]
policy = ["inputsynth"]
scorer = ["common"]
replay = ["common", "hypervisor"]
observatory = ["common"]
controlplane = ["common"]

[dependencies]
prost = { version = "0.13", optional = true }
tonic = { version = "0.12", optional = true }

[build-dependencies]
protoc-bin-vendored = { version = "3", optional = true }
tonic-build = { version = "0.12", optional = true }
