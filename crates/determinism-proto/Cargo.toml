[package]
name = "determinism-proto"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Shared Project Determinism protobuf contract facade"

[features]
default = ["all"]
all = [
  "common",
  "hypervisor",
  "snapstore",
  "orchestrator",
  "inputsynth",
  "policy",
  "scorer",
  "replay",
  "observatory",
  "controlplane",
]
common = []
hypervisor = ["common"]
snapstore = ["common"]
orchestrator = ["common", "controlplane", "dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost"]
inputsynth = ["common", "dep:prost", "dep:tonic", "dep:tonic-prost"]
policy = ["inputsynth"]
scorer = ["common", "dep:prost", "dep:tonic", "dep:tonic-prost"]
replay = ["common", "hypervisor"]
observatory = ["common"]
controlplane = ["common"]

[dependencies]
prost = { version = "0.14.4", optional = true }
prost-types = { version = "0.14", optional = true }
tonic = { version = "0.14.6", optional = true }
tonic-prost = { version = "0.14.6", optional = true }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
