syntax = "proto3";
package determinism.scorer.v1;

service StateScorer {
  rpc ScoreBatch(ScoreBatchRequest) returns (ScoreBatchResponse);
  rpc LoadFeatureMap(LoadFeatureMapRequest) returns (LoadFeatureMapResponse);
  rpc LoadScoringProgram(LoadScoringProgramRequest) returns (LoadScoringProgramResponse);
  rpc CheckpointArchive(CheckpointArchiveRequest) returns (CheckpointArchiveResponse);
  rpc RestoreArchive(RestoreArchiveRequest) returns (RestoreArchiveResponse);
  rpc ReplayCommits(ReplayCommitsRequest) returns (ReplayCommitsResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ScoreBatchRequest {
  string experiment_id = 1;
  repeated StateInput states = 2;
  ArchiveUpdateMode archive_update = 3;
  string client_batch_id = 4;
}

enum ArchiveUpdateMode {
  ARCHIVE_UPDATE_MODE_UNSPECIFIED = 0;
  SCORE_AND_INSERT = 1;
  SCORE_ONLY = 2;
}

message StateInput {
  string node_ref = 1;
  bytes feature_bytes = 2;
  oneof framebuffer {
    bytes fb_lz4 = 3;
    bytes fb_raw = 4;
    string fb_blob_ref = 5;
  }
  FramebufferMeta fb_meta = 6;
}

message FramebufferMeta {
  uint32 width = 1;
  uint32 height = 2;
  PixelFormat format = 3;
  uint32 uncompressed_len = 4;
}

enum PixelFormat {
  PIXEL_FORMAT_UNSPECIFIED = 0;
  RGB888 = 1;
  RGB555_LE = 2;
  GRAY8 = 3;
  XRGB8888 = 4;
}

message ScoreBatchResponse {
  string client_batch_id = 1;
  uint64 archive_seq = 2;
  repeated ScoreResult results = 3;
}

message ScoreResult {
  string node_ref = 1;
  ItemError error = 2;
  double progress_score = 3;
  double novelty_score = 4;
  bytes state_hash = 5;
  bool goal_hit = 6;
  bool duplicate = 7;
  repeated ComponentScore component_breakdown = 8;
  NoveltyDetail novelty_detail = 9;
  uint32 stage = 10;
  bool prune = 11;
  repeated double decoded = 12;
}

message ComponentScore {
  string name = 1;
  double value = 2;
  bool unlocked = 3;
}

message NoveltyDetail {
  double count_novelty = 1;
  uint64 cell_key = 2;
  uint32 cell_count = 3;
  double visual_novelty = 4;
  uint64 phash = 5;
  uint32 phash_min_hamming = 6;
  double rnd_error = 7;
  double knn_distance = 8;
}

message ItemError {
  ItemErrorKind kind = 1;
  string detail = 2;
}

enum ItemErrorKind {
  ITEM_ERROR_KIND_UNSPECIFIED = 0;
  FEATURE_LEN_MISMATCH = 1;
  DECODE_FAILED = 2;
  FB_META_MISMATCH = 3;
  FB_DECOMPRESS_FAILED = 4;
  FB_REF_UNSUPPORTED = 5;
}

message LoadFeatureMapRequest {
  string experiment_id = 1;
  oneof source {
    bytes inline_yaml = 2;
    string artifact_ref = 3;
  }
  CompiledLayout layout = 4;
  FrameSpec frame = 5;
  bool rebin = 6;
}

message LoadFeatureMapResponse {
  bytes feature_map_hash = 1;
  uint32 field_count = 2;
  uint32 feature_bytes_len = 3;
  repeated string warnings = 4;
}

message CompiledLayout {
  repeated ExtractRange ranges = 1;
}

message ExtractRange {
  string region = 1;
  uint32 layout_version = 2;
  uint64 offset = 3;
  uint32 len = 4;
}

message FrameSpec {
  uint32 width = 1;
  uint32 height = 2;
  uint32 stride = 3;
  PixelFormat format = 4;
}

message LoadScoringProgramRequest {
  string experiment_id = 1;
  oneof source {
    bytes inline_yaml = 2;
    string artifact_ref = 3;
  }
}

message LoadScoringProgramResponse {
  bytes program_hash = 1;
  repeated string component_names = 2;
  string goal_expr = 3;
  repeated string warnings = 4;
  repeated string stage_names = 5;
}

message CheckpointArchiveRequest {
  string experiment_id = 1;
  string checkpoint_id = 2;
}

message CheckpointArchiveResponse {
  string archive_ref = 1;
  bytes archive_hash = 2;
  uint64 archive_seq = 3;
  uint64 cell_count = 4;
  uint64 phash_count = 5;
  uint64 embedding_count = 6;
  uint64 blob_bytes = 7;
}

message RestoreArchiveRequest {
  string experiment_id = 1;
  string checkpoint_id = 2;
  string archive_ref = 3;
}

message RestoreArchiveResponse {
  uint64 archive_seq = 1;
  uint64 cell_count = 2;
  uint64 phash_count = 3;
  uint64 embedding_count = 4;
  bytes bound_feature_map_hash = 5;
  bytes bound_scoring_program_hash = 6;
}

message ReplayCommitsRequest {
  string experiment_id = 1;
  repeated CommittedState states = 2;
}

message CommittedState {
  bytes state_hash = 1;
  uint64 cell_key = 2;
}

message ReplayCommitsResponse {
  uint64 applied = 1;
  uint64 skipped = 2;
}

message StatsRequest {
  string experiment_id = 1;
}

message StatsResponse {
  uint64 batches_total = 1;
  uint64 states_total = 2;
  uint64 item_errors_total = 3;
  double dedup_rate = 4;
  uint64 cell_count = 5;
  double mean_count_novelty_last_1k = 6;
  uint64 phash_count = 7;
  uint64 embedding_count = 8;
  uint64 archive_seq = 9;
  uint64 goal_hits_total = 10;
  LatencyHistogram batch_latency = 11;
  GpuInfo gpu = 12;
  bytes loaded_feature_map_hash = 13;
  bytes loaded_scoring_program_hash = 14;
}

message HealthRequest {}

message HealthResponse {
  ServingStatus status = 1;
  string version = 2;
}

message LatencyHistogram {
  uint64 p50_us = 1;
  uint64 p90_us = 2;
  uint64 p99_us = 3;
  uint64 max_us = 4;
}

message GpuInfo {
  bool present = 1;
  string name = 2;
  uint64 mem_used = 3;
  string backend = 4;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}
