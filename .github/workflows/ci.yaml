name: ci
on:
  pull_request:
  push:
jobs:
  rust:
    strategy:
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
